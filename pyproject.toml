[project]
name = "freight-agents-volume-forecast"
version = "0.1.0"
description = "Backtested daily volume forecasts with an agent that answers through tools"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pydantic>=2.7",
    "freight-agents-llm",
    "freight-agents-agentcore",
    "freight-agents-evals",
]

[project.scripts]
freight-forecast = "freight_agents.volume_forecast.cli:main"

[tool.uv.sources]
freight-agents-llm = { workspace = true }
freight-agents-agentcore = { workspace = true }
freight-agents-evals = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
