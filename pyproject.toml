[project]
name = "freight-agents-volume-forecast"
version = "0.1.0"
description = "Backtested daily volume forecasts with an agent that answers through tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pydantic>=2.7",
    "freight-agents-agentcore",
    "freight-agents-evals",
    "freight-agents-llm",
]

[project.scripts]
freight-forecast = "freight_agents.volume_forecast.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.8",
    "freight-agents-devtools",
    "pandas-stubs>=2.2",
]

[tool.uv]
# cryptography 49 and later publish no Intel Mac wheels; the last release with one keeps
# that machine on a published, self-contained build.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everywhere else, the release with the fixes for PYSEC-2026-3552, 3553 and 3554.
    "cryptography>=50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv.sources]
freight-agents-agentcore = { git = "https://github.com/aliazam2012/agent-runtime", tag = "v0.1.0", subdirectory = "packages/agentcore" }
freight-agents-devtools = { git = "https://github.com/aliazam2012/agent-runtime", tag = "v0.1.0", subdirectory = "packages/devtools" }
freight-agents-evals = { git = "https://github.com/aliazam2012/agent-runtime", tag = "v0.1.0", subdirectory = "packages/evals" }
freight-agents-llm = { git = "https://github.com/aliazam2012/agent-runtime", tag = "v0.1.0", subdirectory = "packages/llm" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

# scikit-learn and statsmodels ship no type information; their calls are
# confined to models.py, behind typed wrappers.
[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --strict-markers"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
